spring:
  # Java 21: Virtual Threads (JEP 444) — enables virtual threads for the entire
  # Tomcat request thread pool AND the async executor. Every @Transactional DB call
  # blocks a virtual thread instead of a platform thread, allowing the JVM to park
  # it during JDBC I/O and reuse the carrier thread for other requests.
  # Zero code changes required — this single property activates Project Loom.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/javatest
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 50
        id:
          new_generator_mappings: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type.descriptor.sql: TRACE
        orm.jdbc.bind: TRACE

# ─── Spring Boot Actuator ──────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, circuitbreakers
  health:
    circuitbreakers:
      enabled: true

# ─── Resilience4j ─────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED        # COUNT_BASED or TIME_BASED
        sliding-window-size: 100                # number of calls in the sliding window (for COUNT_BASED)
        minimum-number-of-calls: 10             # minimum calls before calculating failure rate
        permitted-number-of-calls-in-half-open-state: 10
        wait-duration-in-open-state: 10s        # how long to keep the CB open before moving to HALF_OPEN
        failure-rate-threshold: 50              # percentage of failures to trip the CB
        slow-call-rate-threshold: 100           # percent of slow calls to consider as failure (optional)
        slow-call-duration-threshold: 2s        # threshold to mark a call as slow (Duration)
        event-consumer-buffer-size: 10
        record-exceptions:
          - java.io.IOException
          - org.springframework.dao.DataAccessException
          - java.sql.SQLException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
    instances:
      backendA:
        base-config: default
        sliding-window-size: 50
        minimum-number-of-calls: 5
        failure-rate-threshold: 40
        wait-duration-in-open-state: 15s
        record-exceptions:
          - org.springframework.dao.DataAccessException
          - java.sql.SQLException
          - java.net.SocketTimeoutException
      databaseCalls:
        base-config: default
        sliding-window-type: TIME_BASED         # use a time window for DB calls
        sliding-window-size: 60                 # 60 seconds when TIME_BASED
        minimum-number-of-calls: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        record-exceptions:
          - org.springframework.dao.DataAccessException
          - java.sql.SQLException
          - java.net.SocketTimeoutException
  retry:
    instances:
      databaseCalls:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - java.sql.SQLTransientException
        # Java 21: Sealed Classes — EmployeeDomainException is the sealed parent of
        # EmployeeNotFoundException, EmployeeConflictException, and ServiceUnavailableException.
        # Resilience4j resolves ignore via isAssignableFrom, so one entry covers all three.
        ignore-exceptions:
          - com.cleancoders.postgresqltranscations.exception.EmployeeDomainException
